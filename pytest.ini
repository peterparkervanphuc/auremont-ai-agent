[pytest]
testpaths = tests
python_files = test_*.py
# pytest-asyncio is installed but was never configured; without this any
# `async def test_` is skipped with a warning instead of actually running.
asyncio_mode = auto
addopts = -ra
# Deliberately no `log_level` here: it calls setLevel() on the root logger
# globally and would mask the level assertions in test_logging_config.py.
# Tests use caplog.at_level() per test instead.
log_cli = false
