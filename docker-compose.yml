services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai20k_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://salesmate:salesmate@mysql:3306/salesmate_db
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      # Persist Admin tool/token/trace metrics in MySQL. JSONL tracing remains an
      # independent opt-in export for eval/debug datasets.
      OBSERVABILITY_METRICS_ENABLED: ${OBSERVABILITY_METRICS_ENABLED:-true}
      # Browser-facing address for loading public images. Must be localhost, not
      # `minio:9000` — the <img> tag runs on the host machine, not in the Docker network.
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      # Source of project images (~58MB, not in git). Backend downloads to MinIO at
      # startup. Set the value in .env — leaving it empty runs the catalogue without images.
      PROJECT_IMAGES_BASE_URL: ${PROJECT_IMAGES_BASE_URL:-}
      # A single .tar.gz containing all images; one request instead of ~180.
      PROJECT_IMAGES_ARCHIVE_URL: ${PROJECT_IMAGES_ARCHIVE_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_WS_URL: ws://localhost:8000
    container_name: ai20k_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: ai20k_mysql
    ports:
      # 3306 is commonly occupied by a locally installed MySQL service.
      # Containers still communicate with MySQL at mysql:3306; only the host port changes.
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: salesmate_db
      MYSQL_USER: salesmate
      MYSQL_PASSWORD: salesmate
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai20k_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Long-term memory (per-customer / per-sale profiles). Not a source of truth:
  # if Redis is lost, the system still answers normally, just without personalization.
  redis:
    image: redis:7-alpine
    container_name: ai20k_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # AOF: memory profiles survive restarts. Losing the last few seconds is fine.
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ai20k_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Internal automation console. It is opt-in so a normal `docker compose up`
  # remains lightweight; start it with `--profile automation`. The editor is
  # localhost-only and must sit behind SSO/VPN in production.
  n8n:
    # Pin a tested stable release; `latest` can introduce workflow-breaking
    # changes on an unattended production restart.
    image: n8nio/n8n:2.32.7
    container_name: ai20k_n8n
    profiles: ["automation"]
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-n8n-key-change-in-production}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # The reviewed workflow reads NEWS_INGESTION_KEY from $env. Keep n8n
      # private (localhost/SSO/VPN); never expose its editor publicly.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # v2 enables task runners by default. Community packages stay disabled so
      # a workflow import cannot silently install unreviewed executable code.
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: 60
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: 268435456
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: 1000
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      GENERIC_TIMEZONE: Asia/Bangkok
      TZ: Asia/Bangkok
      NEWS_INGESTION_KEY: ${NEWS_INGESTION_KEY:-dev-news-ingestion-key-change-in-production}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
  minio_data:
  redis_data:
  n8n_data:
