services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai20k_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://salesmate:salesmate@mysql:3306/salesmate_db
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      # Persist Admin tool/token/trace metrics in MySQL. JSONL tracing remains an
      # independent opt-in export for eval/debug datasets.
      OBSERVABILITY_METRICS_ENABLED: ${OBSERVABILITY_METRICS_ENABLED:-true}
      # Browser-facing address for loading public images. Must be localhost, not
      # `minio:9000` — the <img> tag runs on the host machine, not in the Docker network.
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      # Source of project images (~58MB, not in git). Backend downloads to MinIO at
      # startup. Set the value in .env — leaving it empty runs the catalogue without images.
      PROJECT_IMAGES_BASE_URL: ${PROJECT_IMAGES_BASE_URL:-}
      # A single .tar.gz containing all images; one request instead of ~180.
      PROJECT_IMAGES_ARCHIVE_URL: ${PROJECT_IMAGES_ARCHIVE_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_WS_URL: ws://localhost:8000
    container_name: ai20k_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: ai20k_mysql
    ports:
      # 3306 is commonly occupied by a locally installed MySQL service.
      # Containers still communicate with MySQL at mysql:3306; only the host port changes.
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: salesmate_db
      MYSQL_USER: salesmate
      MYSQL_PASSWORD: salesmate
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai20k_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Long-term memory (per-customer / per-sale profiles). Not a source of truth:
  # if Redis is lost, the system still answers normally, just without personalization.
  redis:
    image: redis:7-alpine
    container_name: ai20k_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # AOF: memory profiles survive restarts. Losing the last few seconds is fine.
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ai20k_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  qdrant_data:
  minio_data:
  redis_data:
